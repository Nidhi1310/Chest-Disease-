name: Publish Existing Trained Model

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful training artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovered
          gh run download 36658154101 -n chest-disease-real-training -D recovered

      - name: Publish model release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODEL_FILE=recovered/model/chest_disease_vgg16.keras
          test -f "$MODEL_FILE"
          if gh release view chest-disease-model >/dev/null 2>&1; then
            gh release upload chest-disease-model "$MODEL_FILE" --clobber
          else
            gh release create chest-disease-model "$MODEL_FILE" \
              --title "Chest Disease Model" \
              --notes "VGG16 baseline model produced by the successful real-data training workflow."
          fi

      - name: Publish model URL
        run: |
          echo "Model URL:"
          echo "https://github.com/Nidhi1310/Chest-Disease-/releases/download/chest-disease-model/chest_disease_vgg16.keras"
