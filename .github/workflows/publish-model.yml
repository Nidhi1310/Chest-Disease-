name: Publish Existing Trained Model

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful training artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovered
          gh run download 36659810983 -n chest-disease-real-training -D recovered
          test -f recovered/model/chest_disease_vgg16.keras

      - name: Publish model release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODEL_FILE=recovered/model/chest_disease_vgg16.keras
          if gh release view chest-disease-model >/dev/null 2>&1; then
            gh release upload chest-disease-model "$MODEL_FILE" --clobber
          else
            gh release create chest-disease-model "$MODEL_FILE" \
              --title "Chest Disease Model" \
              --notes "VGG16 baseline model produced by the successful real-data training workflow (#6)."
          fi

      - name: Show model release URL
        run: echo "https://github.com/Nidhi1310/Chest-Disease-/releases/download/chest-disease-model/chest_disease_vgg16.keras"